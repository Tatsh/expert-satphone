      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                token:
                  type: 'string'
              required:
                - 'token'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  password:
                    type: 'string'
                  status:
                    $ref: '#/components/schemas/Status'
                  user_id:
                    type: 'string'
                type: 'object'
          description: |
            The account behind the code. Statuses 103107 and 103108 both mean the code is invalid.
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
