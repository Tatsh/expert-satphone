                      match.
                    items:
                      items:
                        type: 'string'
                      type: 'array'
                    type: 'array'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: 'The matching player.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Look up a player by search identifier.'
      tags:
        - 'rival'
  /user/iOS/v1/FetchTransferToken.json:
