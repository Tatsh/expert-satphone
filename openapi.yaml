  /aqq/api/JP/v1/seqs/{seqID}/Played:
    post:
      parameters:
        - $ref: '#/components/parameters/SeqID'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                musicID:
                  type: 'integer'
                userID:
                  description: 'The literal `ERRUSR` when the keychain holds no editor identity.'
                  type: 'string'
              required:
                - 'musicID'
                - 'userID'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: 'integer'
                type: 'object'
          description: 'Whether the play was recorded.'
      servers:
        - url: 'https://jubeat-lab.s.game.konami.jp'
      summary: 'Record a play of a shared chart.'
      tags:
        - 'lab'
  /aqq/api/JP/v1/seqs/{seqID}/VoteLevel:
    post:
      parameters:
        - $ref: '#/components/parameters/SeqID'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                level:
                  description: 'The difficulty the player thinks the chart deserves.'
                  type: 'integer'
                musicID:
                  type: 'integer'
                userID:
                  description: 'The literal `ERRUSR` when the keychain holds no editor identity.'
                  type: 'string'
              required:
                - 'level'
                - 'musicID'
                - 'userID'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: 'integer'
                type: 'object'
          description: 'Whether the vote was recorded.'
      servers:
        - url: 'https://jubeat-lab.s.game.konami.jp'
      summary: 'Vote on a shared chart difficulty.'
      tags:
        - 'lab'
  /aqq/api/JP/v1/users:
    post:
      description: 'Mints the editor identity, which is then held in the keychain.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                uuid:
                  $ref: '#/components/schemas/ClientUuid'
              required:
                - 'uuid'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  MsgUser:
                    type: 'string'
                  Passwd:
                    type: 'string'
                  Status:
                    $ref: '#/components/schemas/LabStatus'
                  UserID:
                    type: 'string'
                type: 'object'
          description: |
            The new identity. A response missing either `UserID` or `Passwd` fails with no message,
            whatever `Status` says.
      servers:
        - url: 'https://jubeat-lab.s.game.konami.jp'
      summary: 'Create an editor identity.'
      tags:
        - 'lab'
  /aqq/api/JP/v1/users/SpecialUser:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                userID:
                  type: 'string'
                userName:
                  type: 'string'
                userType:
                  type: 'integer'
              required:
                - 'userID'
                - 'userName'
                - 'userType'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  MsgUser:
                    type: 'string'
                  Status:
                    $ref: '#/components/schemas/LabStatus'
                type: 'object'
          description: 'Whether the account was created.'
      servers:
        - url: 'https://jubeat-lab.s.game.konami.jp'
      summary: 'Create a named editor account.'
      tags:
        - 'lab'
  /aqq/api/JP/v1/users/{userID}/Session:
    post:
      description: 'Opens the web session the editor pages run under.'
      parameters:
        - $ref: '#/components/parameters/LabUserID'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                passwd:
                  type: 'string'
              required:
                - 'passwd'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  MsgUser:
                    type: 'string'
                  Status:
                    $ref: '#/components/schemas/LabStatus'
                type: 'object'
          description: 'Whether the session opened. The session itself rides on the response cookies.'
      servers:
        - url: 'https://jubeat-lab.s.game.konami.jp'
      summary: 'Open an editor web session.'
      tags:
        - 'lab'
  /aqq/api/JP/v1/users/{userID}/Session2:
    post:
      description: 'The top-page twin of `Session`, with the same body and response.'
      parameters:
        - $ref: '#/components/parameters/LabUserID'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                passwd:
                  type: 'string'
              required:
                - 'passwd'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  MsgUser:
                    type: 'string'
                  Status:
                    $ref: '#/components/schemas/LabStatus'
                type: 'object'
          description: 'Whether the session opened.'
      servers:
        - url: 'https://jubeat-lab.s.game.konami.jp'
      summary: 'Open an editor top-page session.'
      tags:
        - 'lab'
  /aqq/api/JP/v1/users/{userID}/seqs:
    post:
      parameters:
        - $ref: '#/components/parameters/LabUserID'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                jcfData:
                  contentEncoding: 'base64'
                  description: 'The chart file.'
                  type: 'string'
                passwd:
                  type: 'string'
                uuid:
                  $ref: '#/components/schemas/ClientUuid'
              required:
                - 'jcfData'
                - 'passwd'
                - 'uuid'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  Comm:
                    description: 'On status 10160, the rejected comment.'
                    type: 'string'
                  Editor:
                    description: 'On status 10160, the rejected editor name.'
                    type: 'string'
                  MsgUser:
                    type: 'string'
                  Status:
                    $ref: '#/components/schemas/LabStatus'
                  Title:
                    description: 'On status 10160, the rejected title.'
                    type: 'string'
                type: 'object'
          description: |
            The upload result. On status 30170 the response also carries `UserID` and `Passwd`,
            which replace the keychain before the upload is retried.
      servers:
        - url: 'https://jubeat-lab.s.game.konami.jp'
      summary: 'Upload an edited chart.'
      tags:
        - 'lab'
  /common/iOS/v1/BeginSession.json:
    post:
      description: |
        Opens the signed session. `SessionDownloader` sends this automatically whenever it holds no
        session cookies, or when a 1012xx status says the session went stale, and then replays the
        request that triggered it. It is never called directly by a screen.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                passwd:
                  type: 'string'
                target:
                  $ref: '#/components/schemas/RegionCode'
                user_id:
                  type: 'string'
              required:
                - 'cnonce'
                - 'passwd'
                - 'target'
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
          description: |
            The session. What matters is the `Set-Cookie` header, which every later request carries;
            the body is only checked for its status.
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Open a signed session.'
      tags:
        - 'session'
  /common/iOS/v1/FetchCampaign.json:
    post:
      description: |
        Fetched during the splash animation. Campaign 1 switches the theme to the Hinabita
        collaboration; campaign 2 turns on the Naga-Cora mode that also enables the map pin.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInfoOnlyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  camp_list:
                    items:
                      properties:
                        id:
                          enum:
                            - 1
                            - 2
                          type: 'integer'
                      type: 'object'
                    type: 'array'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: 'The collaboration campaigns currently running.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Fetch the running collaboration campaigns.'
      tags:
        - 'session'
  /common/iOS/v1/FetchCampaignMap.json:
    post:
      description: 'Only requested while the Naga-Cora campaign is running.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInfoOnlyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  camp_map_list:
                    description: 'Only the first entry is used; the rest are ignored.'
                    items:
                      properties:
                        description:
                          type: 'string'
                        name:
                          type: 'string'
                        pos_x:
                          description: 'Latitude, despite the name.'
                          format: 'double'
                          type: 'number'
                        pos_y:
                          description: 'Longitude, despite the name.'
                          format: 'double'
                          type: 'number'
                      type: 'object'
                    type: 'array'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: 'Where to draw the campaign pin.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Fetch the campaign map pin.'
      tags:
        - 'social'
  /common/iOS/v1/FetchJcubeList.json:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                target:
                  $ref: '#/components/schemas/RegionCode'
                user_id:
                  type: 'string'
              required:
                - 'target'
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  item:
                    description: 'An empty array is treated as an error, not as an empty catalogue.'
                    items:
                      $ref: '#/components/schemas/CubeItem'
                    type: 'array'
                  status:
                    $ref: '#/components/schemas/Status'
                  sum:
                    description: 'The running purchase total, used for the monthly spending cap.'
                    type: 'integer'
                type: 'object'
          description: 'The cube bundles on sale.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'List the purchasable cube bundles.'
      tags:
        - 'purchase'
  /common/iOS/v1/FetchPolicy.json:
    post:
      description: |
        Serves four separate documents, selected by `type`. Sending `revision` -1 asks for the
        current one.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                revision:
                  description: 'The revision already agreed to, or -1 for the current one.'
                  type: 'integer'
                target:
                  $ref: '#/components/schemas/RegionCode'
                type:
                  description: |
                    1 the content usage terms, 2 the in-game currency terms, 3 the challenge-mode
                    policy, 4 the Payment Services Act notice, 8 the notice for minors.
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 8
                  type: 'integer'
              required:
                - 'target'
                - 'type'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  policy:
                    description: |
                      The document text. An empty string means there is nothing to agree to, which
                      the client treats as success rather than as an error.
                    type: 'string'
                  revision:
                    description: 'Recorded locally once the player agrees.'
                    type: 'string'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: 'The requested document.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Fetch a terms or policy document.'
      tags:
        - 'terms'
  /common/iOS/v1/RegistPushToken.json:
    post:
      description: 'Sent once per install, the first time the tune-select screen appears with a token in hand.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                token:
                  description: 'The APNs device token.'
                  type: 'string'
                user_id:
                  type: 'string'
              required:
                - 'token'
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
          description: |
            The result. The client marks the token sent regardless of what comes back, so a failure
            here is not retried until the next install.
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Register the push token.'
      tags:
        - 'session'
  /common/iOS/v1/SendSumPrice.json:
    post:
      description: |
        Reports the locally accumulated spend before challenge mode opens, so the server can apply
        the monthly cap.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                sum:
                  type: 'integer'
              required:
                - 'sum'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
          description: 'Whether the total was accepted.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Report the accumulated purchase total.'
      tags:
        - 'purchase'
  /common/iOS/v1/VerifyReceipt.json:
    post:
      description: |
        Verifies an App Store receipt server-side. Two body shapes reach the same endpoint: a
        non-consumable purchase or restore sends `products` and `prices`, while a consumable
        (a cube bundle) sends `sku`, `price`, `market`, and the credentials.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - description: 'The pack purchase and restore form.'
                  properties:
                    cnonce:
                      $ref: '#/components/schemas/Cnonce'
                    prices:
                      description: 'One entry per product, -1 where the price is unknown.'
                      items:
                        type: 'integer'
                      type: 'array'
                    products:
                      items:
                        type: 'string'
                      type: 'array'
                    receipt:
                      contentEncoding: 'base64'
                      type: 'string'
                  required:
                    - 'prices'
                    - 'products'
                    - 'receipt'
                  type: 'object'
                - description: 'The consumable (cube) form.'
                  properties:
                    cnonce:
                      $ref: '#/components/schemas/Cnonce'
                    market:
                      description: 'Always 1.'
                      type: 'integer'
                    passwd:
                      description: 'Sent only when the keychain holds an editor identity.'
                      type: 'string'
                    price:
                      items:
                        type: 'integer'
                      type: 'array'
                    receipt:
                      contentEncoding: 'base64'
                      type: 'string'
                    sku:
                      description: 'The App Store product identifier, prefixed `jubeat.cube`.'
                      type: 'string'
                    target:
                      $ref: '#/components/schemas/RegionCode'
                    user_id:
                      description: 'Sent only when the keychain holds an editor identity.'
                      type: 'string'
                  required:
                    - 'market'
                    - 'price'
                    - 'receipt'
                    - 'sku'
                    - 'target'
                  type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
          description: |
            Whether the receipt verified. Fields beyond `status` are not documented.
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Verify an App Store receipt.'
      tags:
        - 'purchase'
  /common/store/iOS/v1/RecommendPack.json:
    post:
      description: 'Drives the "you might also like" strip on a pack detail screen.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                pack_id:
                  description: 'The pack being viewed.'
                  type: 'integer'
                user_id:
                  type: 'string'
              required:
                - 'pack_id'
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  pack_list:
                    description: 'Each entry needs only `ID`; the rest is resolved through StoreKit.'
                    items:
                      properties:
                        ID:
                          type: 'integer'
                      type: 'object'
                    type: 'array'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: 'The recommended packs.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Fetch packs recommended alongside one pack.'
      tags:
        - 'store'
  /info/iOS/v1/Inquiry/:
    get:
      description: |
        Opened in a web view. The page uses an `openurl://` scheme for links that should leave the
        app, which the controller rewrites to `https://`.
      responses:
        '200':
          content:
            text/html:
              schema:
                type: 'string'
          description: 'The inquiry form.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'The player inquiry web page.'
      tags:
        - 'session'
  /log/iOS/v1/PushNotificationReaction.json:
    post:
      description: |
        Sent with no delegate, so nothing observes the outcome. The body is built with
        `setValue:forKey:`, which means a missing push identifier drops the key rather than raising.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                push_id:
                  type: 'string'
                status:
                  description: '1 launched from the notification, 2 received in the foreground, 3 tapped in-app.'
                  enum:
                    - 1
                    - 2
                    - 3
                  type: 'integer'
                user_id:
                  type: 'string'
              type: 'object'
        required: true
      responses:
        '200':
          description: 'Accepted. The body is never read.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Report what the player did with a push notification.'
      tags:
        - 'telemetry'
  /log/iOS/v1/RegistAge.json:
    post:
      description: |
        Records the age band the player selected, which sets the monthly spending cap. The value is
        the selected button index minus one.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                age:
                  type: 'integer'
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
              required:
                - 'age'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
          description: 'Whether the age band was accepted.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Register the age band.'
      tags:
        - 'purchase'
  /scratch/iOS/v1/ExchangeItem.json:
    post:
      description: |
        Spends cubes. `item_type` 1 scratches the panel at `position`; `item_type` 2 refills the
        play coins and takes neither other field.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                item_type:
                  enum:
                    - 1
                    - 2
                  type: 'integer'
                position:
                  description: 'Sent for `item_type` 1 only.'
                  type: 'integer'
                scratch_id:
                  description: 'Sent for `item_type` 1 only.'
                  type: 'integer'
              required:
                - 'item_type'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ServerError'
                  - $ref: '#/components/schemas/ChallengeStatus'
          description: |
            The updated balances, plus the revealed panel for `item_type` 1. Status 204103 means
            the panel was already scratched: the client rewrites the status to zero, applies the
            body anyway, and tells the player no cubes were spent.
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Spend cubes on a scratch or a coin refill.'
      tags:
        - 'scratch'
  /scratch/iOS/v1/FetchMusicInfo.json:
    post:
      description: 'Opens the detail panel for one board cell.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                kind:
                  description: 'Always 0 in the shipped build.'
                  type: 'integer'
                music_id:
                  type: 'integer'
                scratch_id:
                  type: 'integer'
              required:
                - 'kind'
                - 'music_id'
                - 'scratch_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  my_rank:
                    $ref: '#/components/schemas/ScratchResults'
                  server_time:
                    $ref: '#/components/schemas/ServerTimestamp'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: "The player's results on that tune."
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: "Fetch one tune's detail and results."
      tags:
        - 'scratch'
  /scratch/iOS/v1/FetchPresent.json:
    post:
      description: |
        Accepts or declines one present. A coin-overflow refusal (203102) is re-sent with `agree`
        true once the player confirms.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                agree:
                  description: 'True accepts even when it would overflow the balance.'
                  type: 'boolean'
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                present_id:
                  type: 'string'
              required:
                - 'agree'
                - 'present_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ServerError'
                  - $ref: '#/components/schemas/ChallengeStatus'
                  - properties:
                      message:
                        description: |
                          Shown on success, and preferred over `err_message` on failure. Falls back
                          to the client's own text when absent.
                        type: 'string'
                    type: 'object'
          description: 'The updated balances after the present was applied.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Accept or decline a present.'
      tags:
        - 'present'
  /scratch/iOS/v1/FetchPresentList.json:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                target:
                  $ref: '#/components/schemas/RegionCode'
                user_id:
                  type: 'string'
              required:
                - 'target'
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  present:
                    items:
                      $ref: '#/components/schemas/Present'
                    type: 'array'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: 'The unclaimed presents. The array length also becomes the badge count.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'List the unclaimed presents.'
      tags:
        - 'present'
  /scratch/iOS/v1/FetchPrevScratchInfo.json:
    post:
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                prev:
                  description: 'Always 1.'
                  type: 'integer'
              required:
                - 'prev'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  music_list:
                    description: |
                      The previous event line-up. Each entry needs `music_id`, `name`, and
                      `image_url`; the artwork is downloaded separately.
                    items:
                      $ref: '#/components/schemas/ChallengeTune'
                    type: 'array'
                  scratch_id:
                    description: 'The previous event, which the ranking requests then quote.'
                    type: 'integer'
                  status:
                    $ref: '#/components/schemas/Status'
                type: 'object'
          description: "The previous event's line-up."
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: "Fetch the previous event's line-up."
      tags:
        - 'ranking'
  /scratch/iOS/v1/FetchRanking.json:
    post:
      description: 'One page of a ranking. A page is thirty rows.'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                difficulty:
                  description: '0 basic, 1 advanced, 2 extreme, 3 total.'
                  type: 'integer'
                head:
                  type: 'integer'
                kind:
                  description: '0 the country-wide ranking, 1 the rival ranking.'
                  enum:
                    - 0
                    - 1
                  type: 'integer'
                limit:
                  type: 'integer'
                music_id:
                  description: 'Zero asks for the all-tunes ranking.'
                  type: 'integer'
                scratch_id:
                  type: 'integer'
              required:
                - 'difficulty'
                - 'head'
                - 'kind'
                - 'limit'
                - 'music_id'
                - 'scratch_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  has_next:
                    type: 'boolean'
                  my_position:
                    description: "The player's row index. Defaults to `my_rank` when absent."
                    type: 'integer'
                  my_rank:
                    type: 'integer'
                  rank:
                    items:
                      $ref: '#/components/schemas/RankingEntry'
                    type: 'array'
                  status:
                    $ref: '#/components/schemas/Status'
