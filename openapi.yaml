              required:
                - 'user_id'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  err_message:
                    type: 'string'
                  name:
                    description: |
                      Despite the key, an array of matches: the client reads `name[0][0]` as the
