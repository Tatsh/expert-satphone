      requestBody:
        content:
          application/json:
            schema:
              properties:
                cnonce:
                  $ref: '#/components/schemas/Cnonce'
                token:
                  type: 'string'
              required:
                - 'token'
              type: 'object'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
          description: 'Whether the transfer completed.'
      servers:
        - url: 'https://agx11.s.konaminet.jp/agx/api'
      summary: 'Complete a device transfer.'
      tags:
        - 'challenge'
servers:
  - description: |
      The challenge-mode API. Every request is a JSON POST signed with a SHA-256 MAC of the body
      plus a fixed salt in `JBT_REQUEST_MAC`, and the reply's `JBT_RESPONSE_MAC` is checked the same
      way with the request's `cnonce` folded in. A reply whose MAC does not verify is discarded
      before it is parsed, so a replacement server has to reproduce both.
    url: 'https://agx11.s.konaminet.jp/agx/api'
  - description: |
      The store and news CGI. Requests are unsigned, but most replies carry a **store signature
      prefix**: the first 64 bytes are the lower-case SHA-256 hex of the whole body with those same
      64 bytes overwritten by a fixed 64-byte salt, and the JSON document follows them. A body
      shorter than 64 bytes, or one whose digest does not match, is discarded without being parsed,
      so a replacement server has to reproduce the prefix. The endpoints whose response is
      described as sitting "behind the store signature prefix" are the ones this applies to; the
      others (`/new/`, `/startup/`, `/knit/change_color/`, `/gamecenterlist/`, the campaign JSPs,
      `/reward/check/`, and the two `/recommend/` share-text endpoints) return plain JSON.

      During a maintenance window a signed endpoint answers with `StoreError` in place of its usual
      document, still behind the prefix.
    url: 'https://agx.s.konaminet.jp'
  - description: 'The jubeat Lab editor-sharing service. Unsigned JSON over cookie sessions.'
    url: 'https://jubeat-lab.s.game.konami.jp'
tags:
  - description: 'Start-up, device registration, campaigns, and the splash-screen fetches.'
    name: 'session'
  - description: 'Opening and refreshing challenge mode, the display name, and device transfers.'
    name: 'challenge'
  - description: 'The scratch board: revealing cells, spending cubes, and playing tunes.'
    name: 'scratch'
  - description: 'Mission sheets, their missions, and their rewards.'
    name: 'mission'
  - description: 'Rival search, registration, and listing.'
    name: 'rival'
  - description: 'Country-wide and rival rankings, current and previous events.'
    name: 'ranking'
  - description: 'Unclaimed presents.'
    name: 'present'
  - description: 'The in-app catalogue: packs, tunes, markers, and promotions.'
    name: 'store'
  - description: 'Serial-code campaigns and their giveaways.'
    name: 'campaign'
  - description: 'Receipt verification, cube bundles, and the monthly spending cap.'
    name: 'purchase'
  - description: 'Terms of service listing and fetching.'
    name: 'terms'
  - description: 'Play logs, push reactions, and cross-promotion rewards.'
    name: 'telemetry'
  - description: 'Arcade search, campaign map pins, and share text.'
    name: 'social'
  - description: 'jubeat Lab, the editor chart-sharing service.'
    name: 'lab'
